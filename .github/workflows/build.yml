name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ExpenseTracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-apk
          path: ExpenseTracker.apk

      # Every successful build is also published as a GitHub Release, so the APK
      # can be downloaded straight from the phone's browser (Releases page).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Tracker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Install: download ExpenseTracker.apk on your phone and open it. Built from ${{ github.ref_name }} @ ${{ github.sha }}."
          files: ExpenseTracker.apk
          make_latest: true
